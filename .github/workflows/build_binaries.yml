on:
  workflow_dispatch: # Manual trigger only
    inputs:
      targets:
        description: "Comma-separated list of targets to build (leave empty for all Android targets)"
        required: false
        default: "armv7-linux-androideabi,aarch64-linux-android,i686-linux-android,x86_64-linux-android"
        type: string

name: Build Binaries (Manual)

jobs:
  BuildBinaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1.7.1
      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          echo "y" | sdkmanager "ndk;27.2.12479018"

      - name: Build Android binaries using cargokit
        run: |
          # Create a temporary build script that builds but doesn't upload
          mkdir -p temp_build_output

          # Use the cargokit build tool to build binaries (will fail at upload, but binaries will be built)
          dart run build_tool precompile-binaries -v \
            --manifest-dir=../../android/rust \
            --repository=dummy/repo \
            --android-sdk-location=/usr/local/lib/android/sdk \
            --android-ndk-version=27.2.12479018 \
            --android-min-sdk-version=23 \
            --target=armv7-linux-androideabi \
            --target=aarch64-linux-android \
            --target=i686-linux-android \
            --target=x86_64-linux-android \
            --temp-dir=$(pwd)/temp_build_output || true
        env:
          GITHUB_TOKEN: dummy_token
          PRIVATE_KEY: dummy_private_key
        working-directory: engine_context/dart/cargokit/build_tool

      - name: Copy built binaries
        run: |
          # The build will fail at upload, but the binaries are built in temp directory
          # Find and copy the built .so files
          mkdir -p built_binaries
          find engine_context/dart/cargokit/build_tool/temp_build_output -name "*.so" -exec sh -c '
            target_dir=$(dirname "$1" | sed "s/.*target\///g" | sed "s/\/release.*//g")
            mkdir -p "built_binaries/$target_dir"
            cp "$1" "built_binaries/$target_dir/"
          ' _ {} \; 2>/dev/null || true

          # Also check the regular target directory
          if [ -d "target" ]; then
            for target in armv7-linux-androideabi aarch64-linux-android i686-linux-android x86_64-linux-android; do
              if [ -d "target/$target/release" ]; then
                mkdir -p "built_binaries/$target"
                find "target/$target/release" -name "*.so" -exec cp {} "built_binaries/$target/" \;
              fi
            done
          fi

          echo "Built libraries:"
          find built_binaries -name "*.so" -exec ls -la {} \;

      - name: Upload built binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-binaries-16kb
          path: built_binaries/
          retention-days: 30

      - name: List all built files
        run: |
          echo "All built binaries:"
          find built_binaries -name "*.so" -exec ls -la {} \;
